services:
  api:
    environment:
      DEV_AUTH: "false"
      COOKIE_SECURE: "true"
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_started}
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
