server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:8080;
  location /api/ { proxy_pass $api_upstream; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; }
  location /auth/ { proxy_pass $api_upstream; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health { proxy_pass $api_upstream; }
  location / { try_files $uri /index.html; }
}
