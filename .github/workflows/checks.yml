name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onemore_test
          POSTGRES_USER: onemore
          POSTGRES_PASSWORD: onemore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U onemore" --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://onemore:onemore_test@127.0.0.1:5432/onemore_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci && npm run build
        working-directory: web
